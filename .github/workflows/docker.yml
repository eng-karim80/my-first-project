name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-devops-app .

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name test-container my-devops-app

      - name: Test application
        run: curl -f http://localhost:8080

      - name: Stop container
        run: docker stop test-container