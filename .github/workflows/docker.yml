name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t engkarim80/my-devops-app:latest .

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name test-container engkarim80/my-devops-app:latest

      - name: Test application
        run: curl -f http://localhost:8080

      - name: Stop container
        run: docker stop test-container

      - name: Push Docker image
        run: docker push engkarim80/my-devops-app:latest